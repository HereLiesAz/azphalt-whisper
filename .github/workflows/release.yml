name: release
# Restored locally from the central registry snapshot (HereLiesAz/workflows
# registry/1305373490/release-16911b98.source.yml): the 2026-09-20 centralization removed it and the
# binding went obsolete, so no model was ever attached and the manifest's remoteUrl 404'd.
#
# Ships a sherpa-onnx Whisper bundle, the format hosts actually run (encoder + decoder + tokens.txt):
# upstream publishes it as tar.bz2, hosts install `sherpa-bundle` assets as zip, so this repackages the
# int8 models flat into whisper-base.zip, then checksums it into the manifest.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      # MODEL_URL (repo variable) overrides the upstream archive if its path changes.
      - name: Build whisper-base.zip
        env:
          MODEL_URL: ${{ vars.MODEL_URL || 'https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-base.tar.bz2' }}
        run: |
          set -euo pipefail
          curl -fL "$MODEL_URL" -o upstream.tar.bz2
          mkdir upstream && tar xjf upstream.tar.bz2 -C upstream --strip-components=1
          cd upstream
          touch -d '2000-01-01T00:00:00Z' base-encoder.int8.onnx base-decoder.int8.onnx base-tokens.txt
          zip -X -j ../whisper-base.zip base-encoder.int8.onnx base-decoder.int8.onnx base-tokens.txt
          cd ..
          echo "MODEL_SHA=$(sha256sum whisper-base.zip | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "MODEL_SIZE=$(stat -c%s whisper-base.zip)" >> "$GITHUB_ENV"
      - name: Inject checksum + byteSize into manifest
        run: |
          node -e '
            const fs=require("fs");
            const m=JSON.parse(fs.readFileSync("manifest.json","utf8"));
            for (const a of m.assets) {
              a.checksum="sha256-"+process.env.MODEL_SHA;
              a.byteSize=Number(process.env.MODEL_SIZE);
            }
            fs.writeFileSync("manifest.json",JSON.stringify(m,null,2));
          '
      - name: Pack .azp
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.azp
            whisper-base.zip
